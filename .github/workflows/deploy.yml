name: deploy-react-app
on:
  push:
    branches:
      - master
      # - develop
      # - staging
      # - production
jobs:
  build-react-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out code
        uses: actions/checkout@v4
      - name: Installing Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installing dependencies
        run: npm install
      - name: Building project
        if: ${{ github.ref_name == 'master' }} #check branch to build environment
        run: npm run build:development
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Deploy to S3 bucket develop
        if: ${{ github.ref_name == 'master' }}
        run: |
          # file JS/CSS đã có hash nên cache lâu dài; --delete dọn các bản build cũ trên bucket
          aws s3 sync ./build/. s3://react-base-tqhuy --delete --exclude index.html --cache-control "public, max-age=31536000, immutable"
          # index.html không cache để người dùng luôn nhận bản mới nhất
          aws s3 cp ./build/index.html s3://react-base-tqhuy/index.html --cache-control "no-cache"
